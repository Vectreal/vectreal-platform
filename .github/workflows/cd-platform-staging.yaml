# .github/workflows/cd-platform-staging.yaml
name: CD - Deploy Platform to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/vectreal-platform/**'
      - 'packages/core/**'
      - 'packages/embed/**'
      - 'packages/hooks/**'
      - 'packages/viewer/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'eslint.config.mts'
      - 'vitest.shared.mts'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-quality.yaml'
      - '.github/workflows/cd-platform-staging.yaml'
      - '.github/workflows/cd-platform-production.yaml'
      - '.github/workflows/shared-fly-deploy.yaml'
      - '.github/workflows/shared-supabase-migrate.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-platform-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-staging:
    name: Migrate Staging Database
    uses: ./.github/workflows/shared-supabase-migrate.yaml
    with:
      environment: staging
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-staging:
    name: Deploy to Staging Environment
    needs: migrate-staging
    uses: ./.github/workflows/shared-fly-deploy.yaml
    with:
      app_name: vectreal-platform-staging
      fly_config: apps/vectreal-platform/fly.staging.toml
      environment: staging
      fail_on_health_check: false
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VITE_PUBLIC_POSTHOG_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_UI_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_UI_HOST }}