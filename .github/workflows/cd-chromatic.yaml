name: CD - Publish Storybook to Chromatic

# Paths mirror the `stories` globs in storybook/.storybook/main.ts. A story
# directory left out here never gets a PR build when only its own files change.
on:
  push:
    branches:
      - main
    paths:
      - 'storybook/**'
      - 'shared/components/**'
      - 'packages/viewer/**'
      - 'apps/vectreal-platform/app/components/**'
      - '.github/workflows/cd-chromatic.yaml'
  pull_request:
    # `labeled` lets adding the `chromatic` label start a build on a PR whose
    # last push did not upload.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'storybook/**'
      - 'shared/components/**'
      - 'packages/viewer/**'
      - 'apps/vectreal-platform/app/components/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-chromatic
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  chromatic:
    name: Publish Storybook to Chromatic
    runs-on: ubuntu-22.04
    environment: chromatic-publishing
    # Release Please rebases its PR onto main after every merge and bumps
    # packages/viewer/package.json, so it matched the path filter each time and
    # re-snapshotted exactly what the main build had just accepted. It was 119 of
    # 248 runs and about half the billed snapshots between 2026-09-08 and
    # 2026-10-14, while changing nothing that renders.
    #
    # Adding any other label is not a new commit, so it builds nothing.
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--') &&
      (github.event.action != 'labeled' || github.event.label.name == 'chromatic') }}

    # One Chromatic project for the whole workspace. The upload is skipped when
    # no token is configured, so the build and typecheck still run either way.
    env:
      CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_1 }}

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Storybook
        run: npx nx build-storybook storybook

      - name: ⏭️ Chromatic token not configured
        if: env.CHROMATIC_TOKEN == ''
        run: |
          echo "::notice::CHROMATIC_PROJECT_TOKEN_1 is not set. Storybook was built but not published."

      # Every PR builds and type-checks Storybook above, but only a PR labeled
      # `chromatic` uploads. Builds on every PR push were about 880 billed
      # snapshots in five weeks against a 5,000 monthly allowance, and none of
      # them could fail the PR (exitZeroOnChanges). Main always uploads, so the
      # baselines a labeled PR compares against stay current.
      - name: ⏭️ Chromatic upload not requested
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'chromatic')
        run: |
          echo "::notice::Storybook was built but not published. Add the chromatic label to this PR to publish it."

      - name: ⚡ Publish to Chromatic
        if: >-
          env.CHROMATIC_TOKEN != '' &&
          (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'chromatic'))
        uses: chromaui/action@v18
        with:
          projectToken: ${{ env.CHROMATIC_TOKEN }}
          workingDir: storybook
          # Publish the artifact the previous step already built and
          # type-checked, rather than having Chromatic rebuild it. That build
          # passes --stats-json, which TurboSnap (onlyChanged) needs and would
          # otherwise only get from a Chromatic-run build.
          storybookBuildDir: storybook-static
          autoAcceptChanges: 'main'
          exitZeroOnChanges: ${{ github.event_name == 'pull_request' }}
          exitOnceUploaded: true
          onlyChanged: true
