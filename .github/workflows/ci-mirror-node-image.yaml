# .github/workflows/ci-mirror-node-image.yaml
name: CI - Mirror Node Base Image

# apps/vectreal-platform/Dockerfile builds FROM this mirror, so the deploy pulls
# its base image from GHCR with GITHUB_TOKEN instead of anonymously. Anonymous
# pulls from Docker Hub and ECR Public are metered per IP, which GitHub's
# runners share: both failed staging deploys with a 429. This job is the only
# anonymous pull left. It runs once a day rather than on every deploy and tries
# three registries serving the same digest, so a 429 here delays a security
# patch by a day instead of failing a release.
#
# The pull_request trigger runs a change to this file before merge. It pushes
# only when the mirror does not exist yet, which is how it is first created;
# otherwise it is a dry run, so an unmerged edit never replaces the live tag.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-mirror-node-image.yaml'
  pull_request:
    paths:
      - '.github/workflows/ci-mirror-node-image.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-mirror-node-image
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror node:22-alpine to GHCR
    # A fork's or Dependabot's GITHUB_TOKEN cannot write this repository's
    # packages.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      # The official image, one index digest at all three. Google's Docker Hub
      # mirror first; ECR Public answered this job's first run with a 429.
      SOURCES: >-
        mirror.gcr.io/library/node:22-alpine
        docker.io/library/node:22-alpine
        public.ecr.aws/docker/library/node:22-alpine
      TARGET: ghcr.io/vectreal/node:22-alpine
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry-to-registry copy of the whole manifest list, every platform
      # and the same digests, without pulling layers through the runner. The
      # source annotation links the package to this repository.
      - name: Copy image
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          dry_run=""
          # Push from a PR only on a positive "not found"; any other inspect
          # failure (auth, 5xx, rate limit) falls back to a dry run.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            dry_run="--dry-run"
            inspect=$(docker buildx imagetools inspect "$TARGET" 2>&1 || true)
            if grep -q ': not found$' <<< "$inspect"; then
              echo "Mirror does not exist yet; creating it."
              dry_run=""
            fi
          fi
          copied=""
          for source in $SOURCES; do
            if docker buildx imagetools create $dry_run \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "$TARGET" \
              "$source"; then
              copied="$source"
              break
            fi
            echo "::warning::Copy from $source failed; trying the next registry."
          done
          if [ -z "$copied" ]; then
            echo "::error::No registry served node:22-alpine."
            exit 1
          fi
          echo "Copied from $copied."
          if [ -z "$dry_run" ]; then
            docker buildx imagetools inspect "$TARGET"
          fi
