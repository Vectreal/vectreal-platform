name: CI - Quality

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # No paths filter. A workflow skipped by one reports nothing at all, so a
    # required check would sit at "Expected - Waiting for status" forever and the
    # PR could never merge. 62 tracked files, including all of terraform/ and
    # most of .github/, were outside the old filter. `nx affected` already does
    # the real filtering: a README-only change resolves to @vctrl/root, which has
    # no targets, so the run is an install and nothing else.
  merge_group:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    paths:
      - 'apps/vectreal-platform/**'
      - 'packages/core/**'
      - 'packages/embed/**'
      - 'packages/hooks/**'
      - 'packages/viewer/**'
      - 'packages/viewer-e2e/**'
      - 'shared/**'
      - 'storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'eslint.config.mts'
      - 'vitest.shared.mts'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-quality.yaml'
      - '.github/workflows/cd-platform-staging.yaml'
      - '.github/workflows/cd-platform-production.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_call' && format('ci-quality-called-{0}', github.run_id) || format('ci-quality-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      NX_DAEMON: 'false'
      CSRF_SECRET: build-only-csrf-secret
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      SUPABASE_URL: https://build.invalid
      SUPABASE_KEY: build-only-supabase-key
      STRIPE_SECRET_KEY: sk_test_build_only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A branch cut from another pull request keeps that pull request's commits.
      # Once the parent squash-merges, its work sits on main under a new sha, so
      # this branch's merge base is behind it and GitHub re-renders the parent's
      # files as this branch's work. Squashing then copies the parent's commit
      # message into this commit's body and release-please records the one change
      # twice. #750 was cut from #748 and displayed all six of #748's files after
      # #748 merged.
      #
      # The tell is exact: the three-dot diff GitHub renders names files that
      # merging would not change, because they already carry that content on the
      # base branch. Rebasing removes both symptoms because it removes the cause.
      - name: Check the diff is this branch's own work
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Explicit refspec: on a pull request, actions/checkout configures
          # `remote.origin.fetch` for the merge ref, so `git fetch origin main`
          # would leave `origin/main` stale or absent.
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base="origin/$BASE_REF"

          # merge-tree answers "those two conflict" and "I cannot read one of those"
          # with the same exit code, so the head has to be known good before its
          # failure can be read as a conflict. Without this, a head the checkout
          # does not have would take the skip below and report success.
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" > /dev/null || {
            echo "Head commit $HEAD_SHA is not in this checkout, so nothing was compared."
            exit 1
          }

          # A conflicting branch cannot merge at all, so its diff says nothing here.
          if ! tree=$(git merge-tree --write-tree "$base" "$HEAD_SHA"); then
            echo "Branch conflicts with $base, so its merge result is undefined. Skipping."
            exit 0
          fi

          comm -23 \
            <(git diff --name-only "$base...$HEAD_SHA" | sort) \
            <(git diff --name-only "$base" "$tree" | sort) > "$RUNNER_TEMP/displayed-but-unchanged.txt"

          if [[ -s "$RUNNER_TEMP/displayed-but-unchanged.txt" ]]; then
            echo "This pull request displays files it does not change:"
            sed 's/^/  /' "$RUNNER_TEMP/displayed-but-unchanged.txt"
            echo
            echo "Each already carries this content on $base, so the branch is stacked"
            echo "on work that has since merged. Rebase onto $base: the diff above is"
            echo "what reviewers are being shown, and squashing would record those"
            echo "commits in the changelog a second time."
            exit 1
          fi

          echo "Every file in the diff is this branch's own work."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore Nx local cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', '**/project.json', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ github.ref_name }}-
            ${{ runner.os }}-nx-main-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve affected range
        id: affected-range
        shell: bash
        run: |
          BASE_SHA=""
          HEAD_SHA=""

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
            HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          fi

          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            echo "has_range=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "has_range=false" >> "$GITHUB_OUTPUT"
          fi

      # Repo-wide, not `nx affected`: formatting is a property of the tree, not
      # of a project graph, and the files most likely to drift belong to no
      # project at all. A step inside this job rather than a job of its own -
      # a new required check has to exist on main before it can be required, or
      # every open pull request waits on a status that never arrives.
      - name: Check formatting
        run: npx prettier --check .

      - name: Run affected quality targets
        if: ${{ steps.affected-range.outputs.has_range == 'true' }}
        run: npx nx affected -t lint,typecheck,test,build-ci --base=${{ steps.affected-range.outputs.base }} --head=${{ steps.affected-range.outputs.head }}

      - name: Run full quality targets
        if: ${{ steps.affected-range.outputs.has_range != 'true' }}
        run: npx nx run-many -t lint,typecheck,test,build-ci

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # The integration suite exists because the unit tests could not have caught the
  # two defects that reached production: the embed manifest and the asset gate
  # disagreed about which assets an embed may fetch, and `*.myshopify.com` could
  # not be saved at all. Both live in the seam between a decision and the rows it
  # reads, which only a real database exercises.
  #
  # Until now nothing ran it. `vitest.config.ts` excludes `tests/integration/**`
  # and the quality gate runs `lint,typecheck,test,build-ci`, so the suite was
  # opt-in on a developer's machine and `critical-path.spec.ts` was letting
  # modules leave KNOWN_UNGUARDED on the strength of specs no pull request
  # executed.
  #
  # Separate job because a service container is job-scoped, and unconditional for
  # the same reason ci-quality has no paths filter: a skipped job reports nothing,
  # so a required check would wait on it forever.
  integration:
    name: Integration Tests
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      NX_DAEMON: 'false'
    services:
      # Supabase's own image, not stock postgres. The migrations create policies
      # `TO authenticated` over `auth.uid()`, and Postgres resolves both at
      # CREATE POLICY time, so a stock image needs a hand-written bootstrap of
      # roles and an auth schema - a second description of the database that can
      # drift from the one `supabase start` gives developers. This image already
      # carries them. The tag tracks `[db] major_version` in supabase/config.toml.
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: postgres
        # 54322 is the port `supabase start` publishes and the port the
        # test-integration target already points DATABASE_URL at.
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          cd apps/vectreal-platform/supabase/migrations
          for migration in $(ls -1 *.sql | sort); do
            echo "→ $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -q -f "$migration"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm nx run vectreal-platform:test-integration
