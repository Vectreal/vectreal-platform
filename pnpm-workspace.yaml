packages:
  - 'apps/*'
  - 'packages/*'
  - 'shared/*'
  - 'storybook'

# One version per dependency, for the whole repo.
#
# Every manifest that needs one of these references `catalog:` instead of
# naming a range, so a bump happens here and nowhere else. `pnpm publish`
# and `pnpm pack` substitute the real range, which is also what removes the
# need for a custom manifest rewriter before publishing.
#
# Only dependencies shared by more than one manifest belong here. Anything a
# single package owns stays in that package's own manifest.
catalog:
  '@gltf-transform/core': ^4.4.2
  '@gltf-transform/extensions': ^4.4.2
  '@gltf-transform/functions': ^4.4.2
  '@nx/vite': 23.2.1
  '@react-three/drei': ^10.7.8
  '@react-three/fiber': ^9.7.0
  '@vitejs/plugin-react': ^6.0.5
  file-saver: ^2.0.5
  jszip: ^3.10.1
  meshoptimizer: ^1.2.0
  postprocessing: ^6.39.4
  # Exact, not a range: the override below applies this to every peer, and a
  # range would let 19.2.8 and a newer 19.x both satisfy it again.
  react: 19.2.8
  react-dom: 19.2.8
  three: ^0.185.1
  vite: ^8.3.2
  vite-plugin-dts: 5.0.3

# One React for the whole graph, not only for the manifests that name it.
#
# A package that takes React as a peer (Radix, React Three Fiber, drei) gets
# the importer's copy only when that importer declares it; shared/components
# uses Radix without declaring react-dom, so pnpm installed the peer itself,
# at whatever was newest. When React 19.3.0 shipped, a lockfile regeneration
# (a Dependabot bump of morgan, #849) put a second react-dom in the browser
# bundle beside the app's 19.2.8: 14 KB on every route, and portals rendered
# by a React DOM other than the one rendering the page.
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - nx
  - protobufjs
  - sharp
  - supabase
  - unrs-resolver
  - workerd

# jsdom's optional peer, which nothing here imports. Its native binary is never
# built, so jsdom has no 2D context and every spec takes the same path in CI and
# locally. A machine that built it before this list existed got a real context,
# DitherGrain's effect reached `new ResizeObserver`, which jsdom does not
# provide, and 66 specs failed there that passed in CI. Delete
# node_modules/.pnpm/canvas@*/node_modules/canvas/build if yours has one.
ignoredBuiltDependencies:
  - canvas
