# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    groups:
      npm-dependencies:
        patterns:
          - '@nx' # groups nx npm dependencies
    ignore:
      # Each stripe major types `apiVersion` to the one API version it ships
      # with, so a bump that leaves the pin in app/lib/stripe.server.ts behind
      # cannot typecheck. Majors are upgraded by hand together with the pin.
      - dependency-name: 'stripe'
        update-types: ['version-update:semver-major']

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'github-actions'
      - 'dependencies'
