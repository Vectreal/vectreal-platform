# .github/dependabot.yml
#
# Patch and minor updates arrive as one grouped pull request per ecosystem.
# .github/workflows/ci-dependabot-auto-merge.yaml merges the npm one once the
# Quality Gate passes; the GitHub Actions one waits for a person. Majors are
# left out of every catch-all group, so each arrives as its own pull request
# and waits for a person.
#
# The catch-all already moves a family's patches and minors together. Its
# majors would arrive one package at a time, and one member alone cannot
# build, so each lockstep family gets a group for its majors. Only majors: a
# patch sharing a pull request with a pending major would read as major and
# wait with it. Dependabot puts a dependency in the first group it matches,
# so the families come before the catch-all.
#
# The families the auto-merge workflow holds for a person (stripe, React
# Router, three, Supabase) are grouped or excluded here too, which keeps them
# out of the catch-all: a grouped pull request containing one of them would
# otherwise hold every other bump in it back from merging.
#
# Version pins live in the `catalog:` block of pnpm-workspace.yaml, which
# Dependabot updates in place; a catalog bump touches no package.json.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    # Held pull requests count against this, and Dependabot opens nothing
    # new once it is reached, the catch-all included. It is set well above
    # the dozen or so a normal week leaves waiting.
    open-pull-requests-limit: 20
    # A release is only offered once it has been public this long, so a
    # compromised publish is usually yanked before it reaches the lockfile.
    # Security updates ignore this.
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    labels:
      - 'dependencies'
    groups:
      nx-major:
        update-types:
          - 'major'
        patterns:
          - 'nx'
          - '@nx/*'
      storybook-major:
        update-types:
          - 'major'
        patterns:
          - 'storybook'
          - '@storybook/*'
      vitest-major:
        update-types:
          - 'major'
        patterns:
          - 'vitest'
          - '@vitest/*'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/*'
      three:
        patterns:
          - 'three'
          - '@types/three'
          - '@react-three/*'
      supabase:
        patterns:
          - 'supabase'
          - '@supabase/*'
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
        exclude-patterns:
          - 'stripe'
    ignore:
      # Each stripe major types `apiVersion` to the one API version it ships
      # with, so a bump that leaves the pin in app/lib/stripe.server.ts behind
      # cannot typecheck. Majors are upgraded by hand together with the pin.
      - dependency-name: 'stripe'
        update-types: ['version-update:semver-major']
      # Parked majors. Each has a Vectreal Work Items row that removes its rule
      # once the upgrade lands; until then the bump would only reopen the same
      # failing pull request every week.
      # TypeScript 7 is the native compiler and Nx plugins fail to load on it
      # (#1199).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Typed to match the Node 22 runtime; moves with the runtime, not alone
      # (#1194).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # three is 0.x, so a minor is breaking: 0.187 changed the shader chunks
      # the viewer's baked lights patch rewrites (#1297). Patches still arrive.
      - dependency-name: 'three'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-minor']
      # vite pins rolldown exactly, and every vite after 8.3.4 brings a
      # rolldown whose chunking puts three.js on every route's first load via
      # vendor-postprocessing (about 906 KB gz against a 395 KB budget). Held
      # until the manualChunks rules in apps/vectreal-platform/vite.config.ts
      # hold under it.
      - dependency-name: 'vite'
        update-types:
          ['version-update:semver-patch', 'version-update:semver-minor']
      # nx 24 removes the `@nx/eslint:lint` executor 19 of our targets use, so
      # it needs `nx migrate`, not a bump. Members also clear the 14-day
      # cooldown on different days, which sent @nx/eslint 24 alone (#1298).
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'github-actions'
      - 'dependencies'
    groups:
      actions-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
