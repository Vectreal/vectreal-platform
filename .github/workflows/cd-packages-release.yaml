name: CD - Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: packages-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Create Release PR / GitHub Release
    runs-on: ubuntu-22.04
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      root_release_created: ${{ steps.release.outputs.release_created }}
      core_version: ${{ steps.release.outputs['packages/core--version'] }}
      hooks_version: ${{ steps.release.outputs['packages/hooks--version'] }}
      viewer_version: ${{ steps.release.outputs['packages/viewer--version'] }}
      embed_version: ${{ steps.release.outputs['packages/embed--version'] }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7

      - name: Build package-grouped root release notes
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ROOT_VERSION: ${{ steps.release.outputs.version }}
          CORE_VERSION: ${{ steps.release.outputs['packages/core--version'] }}
          HOOKS_VERSION: ${{ steps.release.outputs['packages/hooks--version'] }}
          VIEWER_VERSION: ${{ steps.release.outputs['packages/viewer--version'] }}
          EMBED_VERSION: ${{ steps.release.outputs['packages/embed--version'] }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          extract_section() {
            local file="$1"
            local version="$2"

            if [[ -z "$version" || ! -f "$file" ]]; then
              echo "No changes recorded for this package in this release."
              return
            fi

            local section
            section=$(awk -v version="$version" '
              $0 ~ "^## \\[" version "\\]" {capture=1; next}
              capture && $0 ~ /^## \[/ {exit}
              capture {print}
            ' "$file")

            if [[ -z "${section//[[:space:]]/}" ]]; then
              echo "No changes recorded for this package in this release."
            else
              printf "%s\n" "$section"
            fi
          }

          {
            echo "## Release v${ROOT_VERSION}"
            echo
            echo "### @vctrl/core (${CORE_VERSION:-unchanged})"
            extract_section "packages/core/CHANGELOG.md" "$CORE_VERSION"
            echo
            echo "### @vctrl/hooks (${HOOKS_VERSION:-unchanged})"
            extract_section "packages/hooks/CHANGELOG.md" "$HOOKS_VERSION"
            echo
            echo "### @vctrl/viewer (${VIEWER_VERSION:-unchanged})"
            extract_section "packages/viewer/CHANGELOG.md" "$VIEWER_VERSION"
            echo
            echo "### @vctrl/embed (${EMBED_VERSION:-unchanged})"
            extract_section "packages/embed/CHANGELOG.md" "$EMBED_VERSION"
          } > release-notes.md

          gh release edit "$TAG_NAME" --notes-file release-notes.md

  publish:
    name: Publish Released Packages to NPM
    needs: release-please
    # Publish whenever release-please cuts ANY package release, not only when the
    # root "." component bumps. The linked-versions plugin keeps @vctrl/* in sync,
    # but a release can bump the packages without a root change — gating on the
    # root previously skipped publishing entirely (npm stalled at 0.18.0).
    # Also run on manual workflow_dispatch to (re)publish the current versions;
    # the per-package idempotency check below skips anything already on npm.
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    environment: packages-releasing
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # Required for OIDC authentication with NPM
      contents: read
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # NOTE: intentionally NO `registry-url`. setup-node's registry-url writes
          # a `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line into ~/.npmrc;
          # with no real token that resolves to `_authToken=` (empty), which npm reads
          # as "auth configured" and SKIPS the OIDC exchange, breaking trusted
          # publishing. OIDC needs no .npmrc token line — default registry is npmjs.org.

      - name: Ensure OIDC-capable npm
        shell: bash
        run: |
          set -euo pipefail
          # OIDC trusted publishing needs npm >= 11.5.1. pnpm 10 has no native
          # OIDC and delegates `pnpm publish` to the npm CLI on PATH, so we pin
          # a recent npm here for both the pnpm-delegated publish and any direct
          # npm calls to mint the OIDC token.
          npm install -g npm@latest
          npm --version

      - name: Enforce trusted publishing auth mode
        shell: bash
        run: |
          set -euo pipefail

          # Ensure token-based npm auth is not inherited by downstream steps.
          {
            echo "NODE_AUTH_TOKEN="
            echo "NPM_TOKEN="
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Git
        run: |
          git config --global user.email "<>"
          git config --global user.name "github-actions[bot]"

      - name: Print Environment Info
        run: npx nx report
        shell: bash

      - name: Prepare released packages for publish
        # prepare-publish chains build -> copy-md -> rewrite-manifest, so this
        # builds all four packages AND rewrites their built manifests: strips
        # devDependencies and resolves `workspace:*` @vctrl/* deps to `^<version>`.
        # The leak-guard below then runs on already-rewritten manifests.
        run: pnpm nx run-many -t prepare-publish -p vctrl/core vctrl/hooks vctrl/viewer vctrl/embed
        shell: bash

      - name: Guard - no workspace specifiers in built manifests
        shell: bash
        run: |
          set -euo pipefail
          # Safety net for the prepare-publish rewrite. release-please v4 does NOT
          # rewrite the `workspace:` protocol (by design), so tools/publish/rewrite-manifest.mjs
          # (run by the prepare-publish step above) resolves every `workspace:*` @vctrl/*
          # dep to a real version. If any survive into a built manifest's consumer-facing
          # fields, the published package is broken (uninstallable, or pnpm silently drops
          # the dep). Fail loudly here rather than ship it. devDependencies are stripped by
          # the rewrite, so they cannot leak.
          node -e '
            const fs = require("fs");
            const manifests = [
              "build/packages/vctrl/core/package.json",
              "build/packages/vctrl/hooks/package.json",
              "build/packages/vctrl/viewer/package.json",
              "build/packages/vctrl/embed/package.json"
            ];
            const fields = ["dependencies", "peerDependencies", "optionalDependencies"];
            let bad = false;
            for (const m of manifests) {
              const pkg = JSON.parse(fs.readFileSync(m, "utf8"));
              for (const f of fields) {
                for (const [name, spec] of Object.entries(pkg[f] || {})) {
                  if (typeof spec === "string" && spec.startsWith("workspace:")) {
                    console.error(`LEAK: ${m} ${f}.${name} = ${spec}`);
                    bad = true;
                  }
                }
              }
            }
            if (bad) { console.error("Refusing to publish: unrewritten workspace specifiers."); process.exit(1); }
            console.log("OK: no workspace specifiers in consumer-facing fields.");
          '

      - name: Diagnostics - npm trusted publishing context
        shell: bash
        run: |
          set -euo pipefail

          echo "GitHub context"
          echo "  repository: ${GITHUB_REPOSITORY}"
          echo "  ref: ${GITHUB_REF}"
          echo "  workflow: ${GITHUB_WORKFLOW}"
          echo "  actor: ${GITHUB_ACTOR}"

          echo "Node/npm context"
          node --version
          npm --version
          echo "  npm registry: $(npm config get registry)"
          if [[ "${NODE_AUTH_TOKEN:-}" == "XXXXX-XXXXX-XXXXX-XXXXX" ]]; then
            echo "  NODE_AUTH_TOKEN is setup-node placeholder (no real token configured)"
          elif [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "  NODE_AUTH_TOKEN is set (real value present)"
          else
            echo "  NODE_AUTH_TOKEN is not set"
          fi

          if [[ -f "$HOME/.npmrc" ]]; then
            echo "Sanitized ~/.npmrc"
            sed -E 's#(//registry\.npmjs\.org/:_authToken=).*#\1***REDACTED***#' "$HOME/.npmrc"
          else
            echo "No ~/.npmrc present"
          fi

          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "Requesting OIDC token for npm audience..."
            oidc_response=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
            oidc_token=$(node -e 'let d=""; process.stdin.on("data", c => d += c); process.stdin.on("end", () => { try { const j = JSON.parse(d); process.stdout.write(j.value || ""); } catch {} });' <<< "$oidc_response")

            if [[ -z "$oidc_token" ]]; then
              echo "Failed to mint OIDC token for npm audience"
              echo "$oidc_response"
              exit 1
            fi

            oidc_payload=$(node -e 'const t = process.argv[1]; const p = (t.split(".")[1] || ""); const b = p.replace(/-/g, "+").replace(/_/g, "/"); const pad = "=".repeat((4 - (b.length % 4)) % 4); process.stdout.write(Buffer.from(b + pad, "base64").toString("utf8"));' "$oidc_token")
            echo "OIDC payload (selected claims)"
            node -e 'const c = JSON.parse(process.argv[1]); const out = {iss: c.iss, aud: c.aud, sub: c.sub, repository: c.repository, repository_owner: c.repository_owner, ref: c.ref, job_workflow_ref: c.job_workflow_ref, environment: c.environment}; console.log(JSON.stringify(out, null, 2));' "$oidc_payload"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN not present; id-token: write permission may be missing"
            exit 1
          fi

          echo "Package visibility check (informational)"
          npm view @vctrl/core name --json || true
          npm view @vctrl/hooks name --json || true
          npm view @vctrl/viewer name --json || true

      - name: Publish packages to npm (idempotent, OIDC + provenance)
        # Publish core first so its version exists for hooks' `^<version>` dep.
        # Each package is skipped if that exact version is already on npm, so
        # this is safe to re-run and to trigger manually via workflow_dispatch.
        # `pnpm publish` (nx publish target) delegates to npm on pnpm 10, so the
        # OIDC handshake and provenance are performed by the pinned npm CLI.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          for p in core hooks viewer embed; do
            dir="build/packages/vctrl/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✓ $name@$version already on npm — skipping"
              continue
            fi
            echo "→ Publishing $name@$version"
            ( cd "$dir" && npm pack --dry-run )
            npx nx run "vctrl/$p:publish"
          done
